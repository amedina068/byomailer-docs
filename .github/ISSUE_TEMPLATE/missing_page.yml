name: Missing information
description: The docs do not explain a feature, a setting or a task.
title: "Missing docs: "
labels: ["documentation", "needs-triage"]
body:
  - type: textarea
    id: task
    attributes:
      label: What you tried to do
      description: The task that you tried to do.
      placeholder: Set up a custom link domain with Cloudflare.
    validations:
      required: true
  - type: textarea
    id: where-you-looked
    attributes:
      label: Where you looked
      description: The pages that you read.
  - type: textarea
    id: missing
    attributes:
      label: What was missing
      description: The question that the docs did not answer.
    validations:
      required: true
